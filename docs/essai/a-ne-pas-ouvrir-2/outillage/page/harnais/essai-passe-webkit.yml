# Outillage de l'essai (simulation.md, §9, contrôle 14, « WebKit ») : passe WebKit de la page de l'essai.
# À placer dans .github/workflows/ (l'orchestrateur le range). Lancement manuel seulement, jamais à chaque poussée ;
# droits en lecture seule ; aucun secret ; rien de téléversé (le dépôt est public). La page est reconstruite depuis
# main, et le SHA-256 des deux versions doit égaler celui du rapport de construction. Le journal ne dit que « réussi »
# ou « échoué » et le chemin de chaque différence, sans valeur : les sorties de la construction et de l'installation
# sont tues, et le harnais n'écrit que ses lignes de résultat.
# Même version de Playwright que le rejeu Chromium de l'équipe (1.56.1 au 6 octobre 2026) ; WebKit n'est installé
# que sur cette machine.
# Case « diagnostic » cochée au lancement : seulement la construction, une sonde du profil gardé sur disque, puis (b) et (i)
# étape par étape ; le journal dit où un scénario s'arrête et pourquoi (étape, geste demandé, erreur de l'outil et
# sélecteur attendu), sans aucune valeur du jeu.
name: Essai - passe WebKit
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Mode de diagnostic : (b) et (i) étape par étape, sonde du profil gardé sur disque"
        type: boolean
        default: false
permissions:
  contents: read
env:
  PAGE: docs/essai/a-ne-pas-ouvrir/outillage/page
  SCELLE: docs/essai/a-ne-pas-ouvrir/fichier-scelle.json
  ENTREES: docs/essai/a-ne-pas-ouvrir/entrees-construction.json
  # Rangés avec la page par l'orchestrateur (sorties du rejeu Chromium et de la construction de référence) :
  JOURNAUX: docs/essai/a-ne-pas-ouvrir/outillage/page/sorties/harnais/journaux
  ATTENDUS: docs/essai/a-ne-pas-ouvrir/outillage/page/sorties/harnais/attendus-webkit.json
  RAPPORT: docs/essai/a-ne-pas-ouvrir/outillage/page/sorties/construction/rapport-construction.txt
jobs:
  webkit:
    # Version de macOS fixée : Playwright 1.56.1 fournit WebKit construit jusqu'à macOS 15 (webkit-mac-15-arm64) ; sur un
    # macOS plus récent, il installe ce même WebKit de macOS 15, hors de sa cible (constaté sur macOS 26 : contexte
    # persistant impossible). « macos-latest » suit les nouvelles versions de macOS et ne convient donc pas.
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Machine
        run: |
          echo "machine : macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m), Darwin $(uname -r), image ${ImageOS:-inconnue} ${ImageVersion:-inconnue}"
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright 1.56.1 et WebKit
        run: |
          mkdir "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --silent --no-audit --no-fund playwright@1.56.1 > /dev/null 2>&1 || { echo "échoué : installation"; exit 1; }
          npx playwright install webkit > /dev/null 2>&1 || { echo "échoué : installation de WebKit"; exit 1; }
          node -e "const w = require('playwright-core/lib/server/registry/index').registry.findExecutable('webkit'); const u = (w.downloadURLs || [])[0] || ''; console.log('WebKit de Playwright : ' + ((w.executablePath() || '').match(/webkit-[0-9]+/) || ['inconnu'])[0] + ', construit pour : ' + (u.split('/').pop() || 'inconnu'))" 2> /dev/null || echo "WebKit de Playwright : inconnu"
      - name: Construction depuis main (version de la page, puis versions 2 et 3 du harnais)
        run: |
          python3 -I "$PAGE/construire.py" --scelle "$SCELLE" --entrees "$ENTREES" --sortie "$RUNNER_TEMP/v1" > /dev/null 2>&1 || { echo "échoué : construction"; exit 1; }
          python3 -I "$PAGE/construire.py" --scelle "$SCELLE" --entrees "$ENTREES" --sortie "$RUNNER_TEMP/v2" --version-page 2 > /dev/null 2>&1 || { echo "échoué : construction (version 2)"; exit 1; }
          python3 -I "$PAGE/construire.py" --scelle "$SCELLE" --entrees "$ENTREES" --sortie "$RUNNER_TEMP/v3" --version-page 3 > /dev/null 2>&1 || { echo "échoué : construction (version 3)"; exit 1; }
      - name: Passe WebKit
        env:
          ELENCHOS_PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
          TZ: Europe/Paris
          DIAGNOSTIC: ${{ inputs.diagnostic && '--diagnostic' || '' }}
        run: |
          node "$PAGE/harnais/passe-webkit.js" passe --attendus "$ATTENDUS" --scelle "$SCELLE" --journaux "$JOURNAUX" \
            --construction "$RUNNER_TEMP/v1" --construction-2 "$RUNNER_TEMP/v2" --construction-3 "$RUNNER_TEMP/v3" \
            --rapport-construction "$RAPPORT" $DIAGNOSTIC 2> /dev/null
