# REPRIS pour le vrai jeu (proposé) : la vérification automatique que Scalingo attend avant d'installer
# (« We will always wait that all these tools succeed before deploying your app », documentation de Scalingo).
# À copier par l'orchestrateur dans .github/workflows/test-18h.yml (un agent du code n'écrit pas hors de test-18h/).
# Elle ne tourne que sur la branche mise-en-ligne : de 15h à 19h et le dimanche (heure de Paris), elle échoue exprès,
# et Scalingo n'installe pas (D-043, D-054). IGNORER_HORAIRES y est refusé (variables CI et GITHUB_ACTIONS).
# Aucun secret ici : la base est une base jetable, sans mot de passe, détruite à la fin de la vérification.
name: test-18h
on:
  push:
    branches: [mise-en-ligne]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test-18h
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BASE_DE_TEST_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
      - run: npm ci
      - run: npm run controle
      - run: npm test
